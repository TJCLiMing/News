<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#227700">
    <title>代禱事項維護</title>
    <link rel="icon" type="image/png" href="logo_10th.png">
    <script>
        // 嵌入模式：被其他網站用 iframe 嵌入時隱藏標題列（宿主網頁通常已有自己的標題）
        // 被自家平台外殼（同網域的 index.html）包住不算，照樣顯示標題列
        // 網址參數可強制指定：?header=0 隱藏、?header=1 顯示
        // ?print=1：列印版——畫面上只顯示列印版面（不顯示編輯畫面），讀完資料自動跳出列印
        (function () {
            var q = new URLSearchParams(location.search);
            var p = q.get('header');
            var embedded = window.self !== window.top;
            var ownShell = false;
            try { ownShell = embedded && window.top.location.origin === location.origin; } catch (e) { /* 跨網域宿主讀不到，當成別人的網站 */ }
            if (p === '0' || (p !== '1' && embedded && !ownShell)) document.documentElement.classList.add('embed');
            if (q.get('print') === '1') document.documentElement.classList.add('printmode');
        })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --green: #227700;
            --green-dark: #1a5c00;
            --green-mid: #4f9a2a;
            --green-soft: #eaf6df;
            --green-pale: #f6fbf1;
            --line: #d3eabf;
            --text: #33402b;
            --dim: #8a9a80;
            --warn: #b07a00;
            --danger: #d0392b;
        }
        * { box-sizing: border-box; }
        html { background: #eef7e6; }
        body {
            margin: 0;
            font-family: 'Noto Sans TC', sans-serif;
            background: linear-gradient(160deg, #f4fbec 0%, #e7f4dc 100%);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px));
        }
        button { font-family: inherit; }

        /* ── 標題列（嵌入時隱藏） ── */
        header {
            background: var(--green);
            color: #fff;
            padding: 14px 18px;
            padding-top: calc(14px + env(safe-area-inset-top, 0px));
        }
        header h1 { margin: 0; font-size: 1.2rem; font-weight: 700; letter-spacing: 1px; }
        html.embed header { display: none; }

        .wrap { max-width: 720px; margin: 0 auto; padding: 16px; }
        html.embed .wrap { padding-top: 10px; }

        /* ── 分類頁籤（捲動時固定在上方） ── */
        .tabs-holder {
            position: sticky; top: 0; z-index: 40;
            padding: 8px 0; margin: -8px 0 6px;
            background: linear-gradient(#eef7e6 70%, rgba(238,247,230,0));
        }
        .tabs {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
            background: #fff; padding: 5px; border-radius: 16px;
            border: 1.5px solid var(--line);
        }
        .tab {
            border: 0; background: transparent; border-radius: 12px; padding: 9px 4px;
            font-size: 0.9rem; font-weight: 700; color: var(--dim); cursor: pointer;
            position: relative; line-height: 1.25;
        }
        .tab:hover { background: var(--green-pale); }
        .tab small { display: block; font-size: 0.7rem; font-weight: 500; }
        .tab.active { background: var(--green); color: #fff; }
        .tab .dot {
            position: absolute; top: 5px; right: 7px; width: 7px; height: 7px; border-radius: 50%;
            background: #f2b300; display: none;
        }
        .tab.dirty .dot { display: block; }

        /* ── 平板、電腦（≥768px，html.wide）：不用頁籤，四類一次排成兩欄 ──
           兩種排法用同一套程式畫出來（sectionHtml），手機與平板電腦的功能永遠一致 */
        .cat-title { display: none; }
        html.wide .tabs-holder { display: none !important; }
        html.wide .wrap { max-width: 1100px; }
        html.wide #panel { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 20px; align-items: start; }
        html.wide #panel > .state { grid-column: 1 / -1; }
        html.wide .cat-sec {
            background: rgba(255,255,255,0.55); border: 1.5px solid var(--line);
            border-radius: 20px; padding: 14px; min-width: 0;
        }
        html.wide .cat-title {
            display: flex; align-items: baseline; gap: 8px;
            margin: 0 0 10px; font-size: 1.1rem; color: var(--green);
        }
        .cat-title small { font-size: 0.8rem; font-weight: 500; color: var(--dim); }
        .cat-title .dot { display: none; width: 8px; height: 8px; border-radius: 50%; background: #f2b300; align-self: center; }
        .cat-sec.dirty .cat-title .dot { display: inline-block; }

        .rule {
            font-size: 0.82rem; color: #5f7151; background: var(--green-pale);
            border: 1.5px dashed #bfe0a5; border-radius: 12px; padding: 9px 12px; margin-bottom: 12px;
            line-height: 1.6;
        }
        .rule b { color: var(--green); }

        /* ── 項目列表 ── */
        .item {
            background: #fff; border-radius: 16px; padding: 12px 12px 12px 14px;
            margin-bottom: 10px; display: flex; gap: 10px; align-items: flex-start;
            border: 1.5px solid var(--line);
        }
        .item.changed { border-color: #f2c94c; background: #fffdf3; }
        .item-no {
            flex-shrink: 0; width: 24px; height: 24px; border-radius: 50%;
            background: var(--green-soft); color: var(--green); font-size: 0.78rem; font-weight: 700;
            display: flex; align-items: center; justify-content: center; margin-top: 1px;
        }
        .item-body { flex: 1; min-width: 0; cursor: pointer; }
        .item-main { font-size: 1.05rem; font-weight: 700; word-break: break-all; }
        .item-note { margin-top: 4px; font-size: 0.8rem; color: var(--dim); line-height: 1.5; word-break: break-all; }
        .item-note::before { content: '📝 備註：'; color: #a8b79e; }
        .item-tags { margin-top: 5px; display: flex; gap: 6px; flex-wrap: wrap; }
        .item-tags:empty { display: none; }
        .tag { font-size: 0.68rem; padding: 1px 7px; border-radius: 8px; font-weight: 700; }
        .tag.over { background: #fde4e1; color: var(--danger); }
        .tag.changed { background: #fff2c6; color: var(--warn); }
        .item-actions { display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }
        .item-actions .row { display: flex; gap: 4px; }
        .mini {
            width: 32px; height: 30px; border-radius: 9px; border: 1.5px solid var(--line);
            background: #fff; cursor: pointer; font-size: 0.85rem; color: var(--green-mid);
            display: flex; align-items: center; justify-content: center; padding: 0;
        }
        .mini:hover { background: var(--green-pale); }
        .mini:disabled { opacity: 0.3; cursor: default; }
        .mini.del { color: var(--danger); }

        .empty {
            text-align: center; color: #a8b79e; padding: 34px 0; font-size: 0.95rem;
            background: #fff; border-radius: 16px; border: 2px dashed var(--line); margin-bottom: 10px;
        }
        .add-btn {
            width: 100%; border: 2px dashed #a9d68a; background: var(--green-pale); color: var(--green);
            border-radius: 16px; padding: 13px; font-size: 1rem; font-weight: 700; cursor: pointer;
        }
        .add-btn:hover { background: var(--green-soft); }

        /* ── 經文 ── */
        .verse-card { background: #fff; border-radius: 18px; padding: 16px; border: 1.5px solid var(--line); }
        label.f { display: block; font-size: 0.85rem; font-weight: 700; margin: 4px 0 6px; color: #5f7151; }
        textarea, input[type=text] {
            width: 100%; font-family: inherit; font-size: 1rem; color: var(--text);
            border: 2px solid #dcecce; border-radius: 12px; padding: 10px 12px; outline: none; background: #fff;
        }
        textarea:focus, input:focus { border-color: var(--green-mid); }
        textarea { resize: vertical; min-height: 84px; line-height: 1.6; }
        .counter { text-align: right; font-size: 0.78rem; color: var(--dim); margin-top: 4px; }
        .counter.over { color: var(--danger); font-weight: 700; }
        .field { margin-bottom: 12px; }

        /* ── 近期代禱的「備註」快選 ── */
        .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
        .chip {
            border: 1.5px solid var(--line); background: #fff; color: var(--green);
            border-radius: 18px; padding: 6px 14px; font-size: 0.92rem; font-weight: 700; cursor: pointer;
        }
        .chip:hover { background: var(--green-pale); }
        .chip.active { background: var(--green); border-color: var(--green); color: #fff; }
        .combo {
            display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
            background: var(--green-pale); border: 1.5px solid var(--line); border-radius: 12px;
            padding: 8px 12px; margin: -2px 0 14px; font-size: 0.85rem; color: #5f7151;
        }
        .combo b { color: var(--text); font-size: 1rem; word-break: break-all; }
        .combo .counter { margin: 0; white-space: nowrap; }

        /* ── 狀態訊息 ── */
        .state { text-align: center; padding: 50px 16px; color: var(--dim); }
        .state .big { font-size: 2rem; margin-bottom: 8px; }
        .state p { margin: 0 0 16px; line-height: 1.6; }

        /* ── 底部儲存列 ── */
        .savebar {
            position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
            background: #fff; border-top: 2px solid var(--line);
            padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
            display: flex; align-items: center; gap: 10px;
            transform: translateY(110%); transition: transform 0.25s ease;
            box-shadow: 0 -6px 20px rgba(34,119,0,0.12);
        }
        .savebar.show { transform: translateY(0); }
        .savebar .msg { flex: 1; font-size: 0.9rem; font-weight: 700; color: var(--warn); }
        .savebar .msg.bad { color: var(--danger); }
        .btn {
            border: 0; border-radius: 22px; padding: 10px 20px; font-size: 0.95rem; font-weight: 700;
            cursor: pointer; white-space: nowrap;
        }
        .btn.primary { background: var(--green); color: #fff; box-shadow: 0 3px 0 var(--green-dark); }
        .btn.primary:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--green-dark); }
        .btn.primary:disabled { background: #b7d3a5; box-shadow: none; cursor: default; transform: none; }
        .btn.ghost { background: #eef3ea; color: #6d7d63; }

        /* ── 編輯彈窗 ── */
        .overlay {
            position: fixed; inset: 0; background: rgba(25,45,15,0.45); z-index: 100;
            display: none; align-items: flex-end; justify-content: center;
        }
        .overlay.show { display: flex; }
        .sheet {
            width: 100%; max-width: 560px; background: #fff;
            border-radius: 22px 22px 0 0; padding: 18px 18px calc(18px + env(safe-area-inset-bottom, 0px));
            border-top: 4px solid var(--green);
            animation: up 0.22s ease;
        }
        @media (min-width: 640px) {
            .overlay { align-items: center; }
            .sheet { border-radius: 22px; }
        }
        @keyframes up { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
        .sheet h2 { margin: 0 0 14px; font-size: 1.1rem; color: var(--green); }
        .sheet .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }

        /* ── 提示 ── */
        .toast {
            position: fixed; left: 50%; bottom: calc(100px + env(safe-area-inset-bottom, 0px));
            transform: translateX(-50%); background: rgba(26,60,10,0.92); color: #fff;
            padding: 10px 16px; border-radius: 22px; font-size: 0.9rem; z-index: 200;
            display: none; align-items: center; gap: 12px; max-width: calc(100% - 32px);
        }
        .toast.show { display: flex; }
        .toast button { background: none; border: 0; color: #c6f0a6; font-weight: 700; cursor: pointer; font-size: 0.9rem; white-space: nowrap; }

        .demo-note {
            font-size: 0.78rem; text-align: center; color: var(--warn);
            background: #fff7da; border: 1px solid #f2dd8c; border-radius: 10px; padding: 6px; margin-bottom: 10px;
        }

        /* ── 列印（版型同禱告版） ── */
        .print-btn {
            width: 100%; border: 1.5px solid var(--line); background: #fff; color: var(--green);
            border-radius: 16px; padding: 12px; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 4px;
        }
        .print-btn:hover { background: var(--green-pale); }
        #printArea { display: none; color: #000; font-family: 'Noto Serif TC', 'Microsoft JhengHei', serif; }
        #printArea .p-title { text-align: center; font-size: 18pt; letter-spacing: 4px; font-weight: 600; margin: 0 0 2pt; }
        #printArea .p-date { text-align: center; font-size: 10pt; color: #555; margin-bottom: 14pt; font-family: 'Noto Sans TC', sans-serif; }
        #printArea .p-sec { margin-bottom: 12pt; break-inside: avoid; }
        #printArea .p-sec-title { font-size: 13pt; font-weight: 600; letter-spacing: 3px; border-bottom: 1.5pt solid #000; padding-bottom: 2pt; margin-bottom: 6pt; }
        #printArea .p-item { font-size: 11.5pt; padding: 3pt 0; border-bottom: .5pt dashed #bbb; }
        #printArea .p-note { font-size: 9.5pt; color: #444; margin-left: 1em; }
        #printArea .p-grid2 { display: grid; grid-template-columns: 1fr 1fr; column-gap: 24pt; }
        /* 列印版（?print=1）：畫面上只顯示工具列＋列印版面，看起來就是要印的那張紙 */
        .ptools { display: none; }
        html.printmode header, html.printmode .wrap, html.printmode .savebar { display: none !important; }
        html.printmode body { padding-bottom: 0; background: #e9ece6; }
        html.printmode .ptools {
            display: flex; align-items: center; gap: 8px;
            position: sticky; top: 0; z-index: 10;
            background: var(--green); color: #fff;
            padding: 10px 14px; padding-top: calc(10px + env(safe-area-inset-top, 0px));
        }
        .ptools .ptitle { flex: 1; font-weight: 700; letter-spacing: 1px; }
        .ptools button {
            border: 0; border-radius: 12px; padding: 7px 14px; font-size: 0.95rem; font-weight: 700; cursor: pointer;
            background: #fff; color: var(--green);
        }
        .ptools button.ghost { background: transparent; color: #fff; border: 1.5px solid rgba(255,255,255,.6); }
        html.printmode #printArea {
            display: block; background: #fff;
            max-width: 210mm; margin: 14px auto; padding: 14mm 12mm;
            box-shadow: 0 2px 12px rgba(0,0,0,.12);
        }
        #printArea .p-loading { text-align: center; color: #888; font-family: 'Noto Sans TC', sans-serif; }
        @media print {
            html, body { background: #fff !important; padding: 0; }
            header, .wrap, .savebar, .overlay, .toast, .ptools { display: none !important; }
            #printArea { display: block; }
            html.printmode #printArea { margin: 0; padding: 0; max-width: none; box-shadow: none; }
        }

        [hidden] { display: none !important; }
    </style>
</head>
<body>

<header><h1>🙏 代禱事項維護</h1></header>

<div class="wrap">
    <div class="demo-note" id="demoNote" hidden>示範模式：使用假資料，不會寫入試算表</div>
    <div class="tabs-holder" id="tabsHolder" hidden><div class="tabs" id="tabs"></div></div>
    <div id="panel"><div class="state"><div class="big">🌱</div><p>讀取中…</p></div></div>
    <button class="print-btn" id="printBtn" hidden>🖨 列印代禱事項（含備註說明）</button>
</div>

<!-- 列印版（?print=1）的工具列：列印時不會印出來 -->
<div class="ptools">
    <span class="ptitle">🖨️ 代禱事項列印</span>
    <button id="pPrint">列印</button>
    <button class="ghost" id="pClose">關閉</button>
</div>

<!-- 列印專用版面（螢幕上隱藏，列印時只印這塊；列印版時畫面上也顯示） -->
<div id="printArea"></div>

<!-- 底部儲存列 -->
<div class="savebar" id="savebar">
    <div class="msg" id="saveMsg"></div>
    <button class="btn ghost" id="discardBtn">放棄</button>
    <button class="btn primary" id="saveBtn">儲存</button>
</div>

<!-- 編輯彈窗 -->
<div class="overlay" id="editOverlay">
    <div class="sheet">
        <h2 id="editTitle">新增</h2>
        <div class="field">
            <label class="f" id="mainLabel">內容</label>
            <input type="text" id="mainInput" enterkeyhint="done">
            <div class="counter" id="mainCounter"></div>
        </div>
        <!-- 只有近期代禱有：備註快選，會接在姓名稱謂後面變成「○○姐妹（住院）」 -->
        <div id="statusBlock" hidden>
            <div class="field">
                <label class="f">備註</label>
                <div class="chips" id="chips"></div>
                <input type="text" id="statusInput" enterkeyhint="done" placeholder="或自行輸入，例：復健">
            </div>
            <div class="combo">
                <span>投影顯示：<b id="comboText"></b></span>
                <span class="counter" id="comboCounter"></span>
            </div>
        </div>
        <div class="field">
            <label class="f">備註說明 <span style="font-weight:400;color:#a8b79e">（不投影，僅列印）</span></label>
            <textarea id="noteInput" placeholder="可留空"></textarea>
        </div>
        <div class="actions">
            <button class="btn ghost" id="editCancel">取消</button>
            <button class="btn primary" id="editOk">確定</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastAction" hidden>復原</button></div>

<script>
(function () {
    'use strict';

    var API_URL = 'https://script.google.com/macros/s/AKfycbzWzh7mEl9wt7ehw7SWLQpwpJlbRB6AoDhSiFSex7YC2sp92ceICPct4AO64LiyN8lbPg/exec';
    // ?demo=1：用假資料試玩，不會碰到試算表
    var DEMO = new URLSearchParams(location.search).get('demo') === '1';
    // ?print=1：載入完成後自動開列印對話框（給別的網頁放「列印」連結用）
    var AUTO_PRINT = new URLSearchParams(location.search).get('print') === '1';
    var PRINT_MODE = AUTO_PRINT;

    // sheet 對應試算表分頁名稱（分頁名稱不能改，投影程式會掛掉）
    // split：試算表 A 欄是「姓名稱謂（備註）」，畫面上拆成兩格編輯，儲存時再組回去
    var CATS = [
        { key: 'recent',   label: '近期代禱', short: '近期', limit: 15, mainLabel: '姓名稱謂',     example: '楊ＯＯ姐妹（住院）',
          split: true, exampleName: '楊ＯＯ姐妹', statusOptions: ['住院', '開刀', '身體欠安', '心靈欠安'] },
        { key: 'longterm', label: '長期關懷', short: '長期', limit: 5,  mainLabel: '姓名',         example: '陳ＯＯ' },
        { key: 'ministry', label: '近期事工', short: '事工', limit: 30, mainLabel: '事工項目',     example: '9/15-20 秋季靈恩佈道會' }
    ];
    var VERSE = { key: 'verse', label: '經文', short: '經文', textLimit: 60 };

    var server = null;   // 試算表上的版本
    var draft = null;    // 畫面上正在編輯的版本
    var current = 'recent';   // 手機版目前的頁籤；平板電腦版四類一起顯示，用不到
    // 768px 以上（平板、電腦）不用頁籤，一頁全部呈現；跟首頁切換手機／電腦版的寬度一致
    var WIDE = window.matchMedia('(min-width: 768px)');
    document.documentElement.classList.toggle('wide', WIDE.matches);
    function onWideChange() {
        document.documentElement.classList.toggle('wide', WIDE.matches);
        if (draft) render();
    }
    if (WIDE.addEventListener) WIDE.addEventListener('change', onWideChange); else WIDE.addListener(onWideChange);
    var editing = null;  // { cat, index }，index = -1 代表新增

    var $ = function (id) { return document.getElementById(id); };
    var clone = function (o) { return JSON.parse(JSON.stringify(o)); };
    var len = function (s) { return Array.from(s || '').length; };   // 全形字也算 1 個字
    function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
    }
    function catOf(k) { return CATS.find(function (c) { return c.key === k; }); }

    // 「王ＯＯ姐妹（住院）」⇄ ['王ＯＯ姐妹', '住院']；全形、半形括號都認得
    function splitMain(s) {
        var m = String(s || '').match(/^(.*?)\s*[（(]([^（）()]+)[）)]\s*$/);
        return m ? [m[1].trim(), m[2].trim()] : [String(s || '').trim(), ''];
    }
    function joinMain(name, status) {
        name = name.trim(); status = status.trim();
        return status ? name + '（' + status + '）' : name;
    }

    // ═══════════════ API ═══════════════
    function api(action, payload) {
        if (DEMO) return demoApi(action, payload || {});
        // text/plain 避免 CORS 預檢（GAS 不支援 OPTIONS）
        return fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(Object.assign({ action: action }, payload || {}))
        }).then(function (r) {
            return r.text().then(function (t) {
                try { return JSON.parse(t); }
                catch (e) { throw new Error('伺服器回應格式不對（後端可能尚未部署新版）'); }
            });
        });
    }

    var demoDb = {
        recent:   { rows: [['王ＯＯ姐妹（住院）', '於 10/8 住院，請為治療代禱'], ['李ＯＯ弟兄（手術）', ''], ['張ＯＯ姐妹（復健）', '']] },
        longterm: { rows: [['林ＯＯ', ''], ['陳ＯＯ', ''], ['黃ＯＯ', '']] },
        ministry: { rows: [['10/24 月佈道', ''], ['10/31 敬老會', '請預備交通接送']] },
        verse:    { text: '應當一無掛慮，只要凡事藉著禱告、祈求和感謝，將你們所要的告訴神。', ref: '腓立比書 4:6', available: true }
    };
    var demoVer = 1;
    function demoApi(action, p) {
        return new Promise(function (resolve) {
            setTimeout(function () {
                if (action === 'prayerGet') {
                    var out = clone(demoDb);
                    Object.keys(out).forEach(function (k) { out[k].hash = 'v' + demoVer; });
                    resolve({ status: 'success', data: out });
                } else {
                    Object.keys(p.changes).forEach(function (k) {
                        var c = p.changes[k];
                        if (k === 'verse') { demoDb.verse.text = c.text; demoDb.verse.ref = c.ref; }
                        else demoDb[k] = { rows: c.rows };
                    });
                    demoVer++;
                    resolve({ status: 'success' });
                }
            }, 400);
        });
    }

    // ═══════════════ 讀取 ═══════════════
    function load() {
        return api('prayerGet').then(function (res) {
            if (res.status !== 'success') throw new Error(res.message || '讀取失敗');
            server = res.data;
            draft = clone(server);
            $('tabsHolder').hidden = false;
            $('printBtn').hidden = false;
            render();
            if (AUTO_PRINT) {
                AUTO_PRINT = false; // 只在第一次載入觸發
                buildPrintArea();
                setTimeout(function () { window.print(); }, 200);
            }
        }).catch(function (err) {
            if (PRINT_MODE) $('printArea').innerHTML = '<p class="p-loading">讀取不到代禱事項：' + esc(err.message) + '<br>請重新整理再試一次</p>';
            $('tabsHolder').hidden = true;
            $('panel').innerHTML = '<div class="state"><div class="big">😢</div><p>讀取不到代禱事項<br><small>' +
                esc(err.message) + '</small></p><button class="btn primary" id="retryBtn">再試一次</button></div>';
        });
    }

    // ═══════════════ 變更偵測 ═══════════════
    function catDirty(k) {
        if (!server) return false;
        if (k === 'verse') return draft.verse.text !== server.verse.text || draft.verse.ref !== server.verse.ref;
        return JSON.stringify(draft[k].rows) !== JSON.stringify(server[k].rows);
    }
    function dirtyKeys() {
        if (!server) return [];
        return CATS.map(function (c) { return c.key; }).concat('verse').filter(catDirty);
    }
    function problem() {
        for (var i = 0; i < CATS.length; i++) {
            var c = CATS[i];
            var bad = draft[c.key].rows.some(function (r) { return !r[0].trim() || len(r[0]) > c.limit; });
            if (bad && catDirty(c.key)) return c.label + '有項目空白或超過字數';
        }
        if (catDirty('verse') && !draft.verse.text.trim()) return '經文不能空白';
        return '';
    }

    // ═══════════════ 畫面 ═══════════════
    // 手機：只畫目前頁籤那一類；平板電腦：四類全畫（近期、長期、事工、經文，排成兩欄）
    function render() {
        var keys = WIDE.matches ? CATS.map(function (c) { return c.key; }).concat(VERSE.key) : [current];
        renderTabs();
        $('panel').innerHTML = keys.map(sectionHtml).join('');
        updateVerseCounter();
        renderSavebar();
    }

    // 一個分類的區塊。按鈕靠外層的 data-cat 判斷是哪一類；標題列只在平板電腦版顯示（手機用頁籤）
    function sectionHtml(k) {
        var c = k === VERSE.key ? VERSE : catOf(k);
        var count = k === VERSE.key ? '' : '<small>' + draft[k].rows.length + ' 筆</small>';
        return '<section class="cat-sec' + (catDirty(k) ? ' dirty' : '') + '" data-cat="' + k + '">' +
            '<h2 class="cat-title">' + c.label + count + '<span class="dot" title="有未儲存的修改"></span></h2>' +
            (k === VERSE.key ? verseHtml() : listHtml(c)) +
            '</section>';
    }

    function renderTabs() {
        $('tabs').innerHTML = CATS.concat(VERSE).map(function (c) {
            var sub = c.key === 'verse' ? '&nbsp;' : draft[c.key].rows.length + ' 筆';
            return '<button class="tab' + (c.key === current ? ' active' : '') + (catDirty(c.key) ? ' dirty' : '') +
                '" data-k="' + c.key + '"><span class="dot"></span>' + c.short + '<small>' + sub + '</small></button>';
        }).join('');
    }

    function listHtml(cat) {
        var rows = draft[cat.key].rows;
        var orig = server[cat.key].rows.map(function (r) { return JSON.stringify(r); });
        var html = '<div class="rule">' + (cat.split ? '姓名稱謂＋備註合計' : cat.mainLabel) +
            ' <b>不超過 ' + cat.limit + ' 字</b>，例：' + esc(cat.example) +
            '<br>備註說明不會投影，只會出現在列印版。由上而下就是投影順序。</div>';

        if (!rows.length) html += '<div class="empty">目前沒有' + cat.label + '</div>';

        rows.forEach(function (r, i) {
            var changed = orig.indexOf(JSON.stringify(r)) === -1;
            var n = len(r[0]);
            var tags = '';
            if (!r[0].trim()) tags += '<span class="tag over">內容空白</span>';
            else if (n > cat.limit) tags += '<span class="tag over">超過 ' + (n - cat.limit) + ' 字</span>';
            if (changed) tags += '<span class="tag changed">未儲存</span>';
            html += '<div class="item' + (changed ? ' changed' : '') + '">' +
                '<div class="item-no">' + (i + 1) + '</div>' +
                '<div class="item-body" data-edit="' + i + '">' +
                    '<div class="item-main">' + (esc(r[0]) || '&nbsp;') + '</div>' +
                    (r[1] ? '<div class="item-note">' + esc(r[1]) + '</div>' : '') +
                    '<div class="item-tags">' + tags + '</div>' +
                '</div>' +
                '<div class="item-actions">' +
                    '<div class="row">' +
                        '<button class="mini" data-up="' + i + '" title="上移"' + (i === 0 ? ' disabled' : '') + '>▲</button>' +
                        '<button class="mini" data-down="' + i + '" title="下移"' + (i === rows.length - 1 ? ' disabled' : '') + '>▼</button>' +
                    '</div>' +
                    '<div class="row">' +
                        '<button class="mini" data-edit="' + i + '" title="編輯">✏️</button>' +
                        '<button class="mini del" data-del="' + i + '" title="刪除">✕</button>' +
                    '</div>' +
                '</div>' +
            '</div>';
        });
        html += '<button class="add-btn" data-add>＋ 新增' + cat.label + '</button>';
        return html;
    }

    function verseHtml() {
        if (!draft.verse.available) {
            return '<div class="state"><div class="big">📖</div><p>試算表「規範說明」分頁裡找不到類型為「經文」的那一列，<br>所以這裡暫時無法修改經文。</p></div>';
        }
        return '<div class="rule">投影畫面上的經文。建議 <b>' + VERSE.textLimit + ' 字以內</b>，太長在布幕上會擠。</div>' +
            '<div class="verse-card">' +
                '<div class="field"><label class="f">經文內容</label>' +
                '<textarea id="verseText">' + esc(draft.verse.text) + '</textarea>' +
                '<div class="counter" id="verseCounter"></div></div>' +
                '<div class="field" style="margin-bottom:0"><label class="f">出處</label>' +
                '<input type="text" id="verseRef" value="' + esc(draft.verse.ref) + '" placeholder="例：腓立比書 4:6"></div>' +
            '</div>';
    }

    function updateVerseCounter() {
        var el = $('verseCounter');
        if (!el) return;
        var n = len(draft.verse.text);
        el.textContent = n + ' / ' + VERSE.textLimit + ' 字（建議）';
        el.classList.toggle('over', n > VERSE.textLimit);
    }

    function renderSavebar() {
        var keys = dirtyKeys();
        $('savebar').classList.toggle('show', keys.length > 0);
        if (!keys.length) return;
        var bad = problem();
        var names = keys.map(function (k) { return k === 'verse' ? '經文' : catOf(k).label; });
        $('saveMsg').textContent = bad ? '⚠️ ' + bad : '未儲存：' + names.join('、');
        $('saveMsg').classList.toggle('bad', !!bad);
        $('saveBtn').disabled = !!bad;
    }

    // ═══════════════ 編輯彈窗 ═══════════════
    function openEdit(catKey, index) {
        var cat = catOf(catKey);
        editing = { cat: cat, index: index };
        var r = index >= 0 ? draft[cat.key].rows[index] : ['', ''];
        $('editTitle').textContent = (index >= 0 ? '編輯' : '新增') + cat.label;
        $('noteInput').value = r[1];

        $('statusBlock').hidden = !cat.split;
        $('mainCounter').hidden = !!cat.split;
        if (cat.split) {
            var parts = splitMain(r[0]);
            $('mainLabel').textContent = cat.mainLabel;
            $('mainInput').value = parts[0];
            $('mainInput').placeholder = '例：' + cat.exampleName;
            $('statusInput').value = parts[1];
            $('chips').innerHTML = cat.statusOptions.map(function (o) {
                return '<button type="button" class="chip" data-v="' + esc(o) + '">' + esc(o) + '</button>';
            }).join('');
        } else {
            $('mainLabel').textContent = cat.mainLabel + '（不超過 ' + cat.limit + ' 字）';
            $('mainInput').value = r[0];
            $('mainInput').placeholder = '例：' + cat.example;
        }
        updateMainCounter();
        $('editOverlay').classList.add('show');
        setTimeout(function () { $('mainInput').focus(); }, 50);
    }
    function closeEdit() { $('editOverlay').classList.remove('show'); editing = null; }

    // 畫面上的值組成要寫回試算表 A 欄的字串
    function editedMain() {
        if (editing.cat.split) return joinMain($('mainInput').value, $('statusInput').value);
        return $('mainInput').value.trim();
    }

    function updateMainCounter() {
        if (!editing) return;
        var main = editedMain();
        var n = len(main);
        var lim = editing.cat.limit;
        var over = n > lim;
        var nameEmpty = !$('mainInput').value.trim();
        if (editing.cat.split) {
            var status = $('statusInput').value.trim();
            Array.prototype.forEach.call($('chips').children, function (c) {
                c.classList.toggle('active', c.dataset.v === status);
            });
            $('comboText').textContent = nameEmpty ? '（請先填姓名稱謂）' : main;
            $('comboCounter').textContent = '合計 ' + n + ' / ' + lim + ' 字';
            $('comboCounter').classList.toggle('over', over);
        } else {
            $('mainCounter').textContent = n + ' / ' + lim + ' 字';
            $('mainCounter').classList.toggle('over', over);
        }
        $('editOk').disabled = nameEmpty || over;
    }

    function confirmEdit() {
        if (!editing) return;
        var main = editedMain();
        var note = $('noteInput').value.trim();
        if (!$('mainInput').value.trim() || len(main) > editing.cat.limit) return;
        var rows = draft[editing.cat.key].rows;
        if (editing.index >= 0) rows[editing.index] = [main, note];
        else rows.push([main, note]);
        closeEdit();
        render();
    }

    // ═══════════════ 儲存 ═══════════════
    function save() {
        var keys = dirtyKeys();
        if (!keys.length || problem()) return;
        var changes = {};
        keys.forEach(function (k) {
            changes[k] = k === 'verse'
                ? { text: draft.verse.text.trim(), ref: draft.verse.ref.trim(), baseHash: server.verse.hash }
                : { rows: draft[k].rows, baseHash: server[k].hash };
        });
        $('saveBtn').disabled = true;
        $('discardBtn').disabled = true;
        $('saveBtn').textContent = '儲存中…';
        api('prayerSave', { changes: changes }).then(function (res) {
            if (res.status === 'success') {
                toast('✅ 已儲存到試算表');
                return reload();
            }
            if (res.code === 'CONFLICT') {
                alert('剛剛有其他人修改了「' + res.sheets.join('、') + '」。\n\n為了避免蓋掉對方的內容，這次沒有儲存。\n按確定會載入最新內容，請再修改一次。');
                return reload();
            }
            alert('儲存失敗：' + (res.message || '未知錯誤'));
        }).catch(function (err) {
            alert('無法連線，變更還留在畫面上，可以稍後再按儲存。\n' + err.message);
        }).then(function () {
            $('saveBtn').textContent = '儲存';
            $('discardBtn').disabled = false;
            renderSavebar();
        });
    }

    function reload() {
        return api('prayerGet').then(function (res) {
            if (res.status !== 'success') return;
            server = res.data;
            draft = clone(server);
            render();
        });
    }

    // ═══════════════ 提示 ═══════════════
    var toastTimer = null, undoFn = null;
    function toast(msg, onUndo) {
        $('toastMsg').textContent = msg;
        undoFn = onUndo || null;
        $('toastAction').hidden = !onUndo;
        $('toast').classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { $('toast').classList.remove('show'); undoFn = null; }, 4000);
    }

    // ═══════════════ 事件 ═══════════════
    $('tabs').addEventListener('click', function (e) {
        var b = e.target.closest('.tab');
        if (!b) return;
        current = b.dataset.k;
        render();
    });

    $('panel').addEventListener('click', function (e) {
        if (e.target.id === 'retryBtn') { $('panel').innerHTML = '<div class="state"><p>讀取中…</p></div>'; return load(); }
        var sec = e.target.closest('[data-cat]');
        if (!sec) return;
        var catKey = sec.dataset.cat;
        if (e.target.closest('[data-add]')) return openEdit(catKey, -1);
        var t = e.target.closest('[data-up],[data-down],[data-edit],[data-del]');
        if (!t) return;
        var rows = draft[catKey].rows;
        if (t.dataset.up != null) {
            var i = +t.dataset.up; rows.splice(i - 1, 0, rows.splice(i, 1)[0]); render();
        } else if (t.dataset.down != null) {
            var j = +t.dataset.down; rows.splice(j + 1, 0, rows.splice(j, 1)[0]); render();
        } else if (t.dataset.edit != null) {
            openEdit(catKey, +t.dataset.edit);
        } else if (t.dataset.del != null) {
            var k = +t.dataset.del;
            var removed = rows.splice(k, 1)[0];
            render();
            toast('已移除「' + removed[0] + '」', function () {
                draft[catKey].rows.splice(k, 0, removed);
                render();
            });
        }
    });

    $('panel').addEventListener('input', function (e) {
        if (e.target.id === 'verseText') { draft.verse.text = e.target.value; updateVerseCounter(); }
        else if (e.target.id === 'verseRef') draft.verse.ref = e.target.value;
        else return;
        renderTabs();
        var vs = document.querySelector('[data-cat="verse"]');
        if (vs) vs.classList.toggle('dirty', catDirty('verse'));
        renderSavebar();
    });

    $('toastAction').addEventListener('click', function () {
        if (undoFn) undoFn();
        undoFn = null;
        $('toast').classList.remove('show');
    });

    $('mainInput').addEventListener('input', updateMainCounter);
    $('mainInput').addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.isComposing) confirmEdit(); });
    $('statusInput').addEventListener('input', updateMainCounter);
    $('statusInput').addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.isComposing) confirmEdit(); });
    // 點快選填入備註；再點一次同一個就取消
    $('chips').addEventListener('click', function (e) {
        var c = e.target.closest('.chip');
        if (!c) return;
        $('statusInput').value = $('statusInput').value.trim() === c.dataset.v ? '' : c.dataset.v;
        updateMainCounter();
    });
    $('editOk').addEventListener('click', confirmEdit);
    $('editCancel').addEventListener('click', closeEdit);
    $('editOverlay').addEventListener('click', function (e) { if (e.target.id === 'editOverlay') closeEdit(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeEdit(); });

    // ═══════════════ 列印（版型同禱告版，印畫面上目前的內容） ═══════════════
    function buildPrintArea() {
        var now = new Date();
        var html = '<div class="p-title">黎明教會 — 代禱事項</div>' +
            '<div class="p-date">列印日期 ' + now.getFullYear() + '/' + (now.getMonth() + 1) + '/' + now.getDate() + '</div>';
        CATS.forEach(function (c) {
            var rows = draft[c.key].rows.filter(function (r) { return r[0].trim(); });
            if (!rows.length) return;
            var items = rows.map(function (r) {
                return '<div class="p-item">' + esc(r[0]) +
                    (r[1] ? '<span class="p-note">— ' + esc(r[1]).replace(/\n/g, '<br>') + '</span>' : '') +
                    '</div>';
            }).join('');
            html += '<div class="p-sec"><div class="p-sec-title">' + c.label + '</div>' +
                (c.key === 'longterm' ? '<div class="p-grid2">' + items + '</div>' : items) +
                '</div>';
        });
        $('printArea').innerHTML = html;
    }
    $('printBtn').addEventListener('click', function () {
        if (!draft) return;
        buildPrintArea();
        window.print();
    });

    $('saveBtn').addEventListener('click', save);
    $('discardBtn').addEventListener('click', function () {
        if (!confirm('放棄所有未儲存的變更？')) return;
        draft = clone(server);
        render();
    });

    window.addEventListener('beforeunload', function (e) {
        if (dirtyKeys().length) { e.preventDefault(); e.returnValue = ''; }
    });

    // 列印版：工具列的「列印」「關閉」；「關閉」關不掉（不是程式開的分頁）就回報告事項
    $('pPrint').addEventListener('click', function () { if (draft) window.print(); });
    $('pClose').addEventListener('click', function () {
        window.close();
        setTimeout(function () { location.href = 'reports.html'; }, 300);
    });
    if (PRINT_MODE) $('printArea').innerHTML = '<p class="p-loading">正在讀取代禱事項，讀完會自動跳出列印…</p>';

    if (DEMO) $('demoNote').hidden = false;
    load();
})();
</script>
</body>
</html>

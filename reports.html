<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>報告事項</title>
    <link rel="icon" type="image/png" href="logo_10th.png">
    <script>
        // 跟著首頁的風格：科技版使用者看到深色標題列
        try { if (localStorage.getItem('uiStyle') === 'tech') document.documentElement.classList.add('tech'); } catch (e) {}
    </script>
    <script src="frame-nav.js?v=3"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; }
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: #f4f4f6;
            color: #4D4D4D;
            min-height: 100vh;
        }

        header {
            background: white;
            border-bottom: 2px solid #ffe0e8;
            padding: 0 14px 8px;
            box-shadow: 0 2px 10px rgba(255,146,169,0.12);
        }
        header .bar {
            height: 48px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        header .note {
            margin: 0;
            font-size: 0.8rem;
            color: #c0587a;
            line-height: 1.4;
        }
        header h1 { margin: 0; font-size: 1.15rem; font-weight: 700; white-space: nowrap; }
        .spacer { flex: 1; }
        header a {
            color: #bbb;
            text-decoration: none;
            font-size: 0.85rem;
            white-space: nowrap;
            transition: color 0.2s;
        }
        header a:hover { color: #FF92A9; }

        main {
            max-width: 480px;
            margin: 0 auto;
            padding: 20px 16px 32px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .card {
            background: white;
            border: 2px solid #ffe0e8;
            border-radius: 18px;
            padding: 18px 16px;
            text-align: center;
        }
        .card h2 {
            margin: 0 0 12px;
            font-size: 1.05rem;
            color: #c0587a;
        }
        .card p {
            margin: 10px 0 0;
            font-size: 0.85rem;
            color: #999;
            line-height: 1.7;
        }
        .card p.tip { margin-top: 12px; color: #c0587a; font-weight: 700; }
        /* 主要按鈕：打開簡報 */
        .btn-main {
            display: block;
            background: #e56a8c;
            color: white;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 14px;
            padding: 14px 12px;
            box-shadow: 0 4px 0 #c0587a;
        }
        .btn-main:active { transform: translateY(2px); box-shadow: 0 2px 0 #c0587a; }
        /* 列印用 PDF 的兩個按鈕 */
        .pdf-row {
            display: flex;
            gap: 10px;
        }
        .pdf-btn {
            flex: 1;
            display: block;
            color: #e56a8c;
            background: white;
            border: 2px solid #ffd6e0;
            border-radius: 14px;
            padding: 10px 6px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1rem;
            line-height: 1.4;
        }
        .pdf-btn small { display: block; font-weight: 400; font-size: 0.75rem; color: #bbb; }
        /* 外框式大按鈕：代禱事項「開啟編輯」 */
        .btn-outline {
            display: block;
            color: #e56a8c;
            background: white;
            border: 2px solid #ffd6e0;
            border-radius: 14px;
            padding: 12px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1rem;
        }
        .btn-outline:hover { background: #fff5f8; }
        .pdf-btn:hover { background: #fff5f8; }

        html.tech body { background: #04060d; color: #d7e4ff; }
        html.tech header { background: #0a0f1e; border-bottom-color: rgba(0,240,255,0.25); box-shadow: none; }
        html.tech header h1 { color: #fff; }
        html.tech header a { color: #5a6b94; }
        html.tech header .note { color: #ffb300; }
        html.tech .card { background: #0a0f1e; border-color: rgba(0,240,255,0.25); }
        html.tech .card h2 { color: #ffb300; }
        html.tech .card p { color: #5a6b94; }
        html.tech .card p.tip { color: #ffb300; }
        html.tech .btn-main { background: #00b8c4; box-shadow: 0 4px 0 #007a82; }
        html.tech .pdf-btn { color: #00f0ff; background: transparent; border-color: rgba(0,240,255,0.45); }
        html.tech .pdf-btn small { color: #5a6b94; }
        html.tech .btn-outline { color: #00f0ff; background: transparent; border-color: rgba(0,240,255,0.45); }
    </style>
</head>
<body>
    <header>
        <div class="bar">
            <h1>📢 報告事項</h1>
            <span class="spacer"></span>
            <a href="index.html">← 首頁</a>
        </div>
        <p class="note">*請於Line通知負責人修改報告內容</p>
    </header>

    <main>
        <section class="card">
            <a class="btn-main" id="viewLink" href="#" target="liming-ext" rel="noopener">📖 打開簡報</a>
            <p class="tip">📱 手機僅供瀏覽、列印<br>✏️ 編輯請用平板或電腦</p>
            <p>手機可以上下捲動，一次看完全部投影片<br>會開在新分頁，看完關掉就回到這裡</p>
        </section>

        <section class="card">
            <h2>🖨️ 列印用 PDF</h2>
            <div class="pdf-row">
                <a class="pdf-btn" id="pdf4" href="#" target="liming-ext" rel="noopener">4 張一頁<small>A4 橫式</small></a>
                <a class="pdf-btn" id="pdf2" href="#" target="liming-ext" rel="noopener">2 張一頁<small>A4 直式</small></a>
            </div>
            <p>按下後約 15～30 秒產生當下最新版<br>列印請用 PDF 畫面的「分享 → 列印」</p>
        </section>

        <section class="card">
            <h2>🙏 代禱事項</h2>
            <a class="btn-outline" href="prayer.html">✏️ 開啟編輯</a>
            <p>近期代禱、長期關懷代禱、近期事工<br>都在這裡更新</p>
        </section>
    </main>

    <script>
        // 簡報只有一份：OneDrive 上的「2026代禱及事項宣佈.pptx」，改完這裡打開的就是最新版。
        // OneDrive 的分享頁禁止被嵌入，所以不在這頁顯示簡報，改用按鈕開新分頁
        // （在外殼裡不是可嵌入網域，會開到共用的 liming-ext 分頁）。
        //
        // EDIT_URL：OneDrive「可以編輯」的分享連結。手機打開是檢視（投影片上下排開、可捲動看完，
        //   要編輯會被導去 PowerPoint APP）；電腦和 iPad 打開就是編輯模式。
        // VIEW_URL：「打開簡報」用的連結。目前和 EDIT_URL 同一個——使用者決定（2026-10-21）：
        //   大部分人用手機，手機瀏覽器本來就不能編輯；頁面上註明「手機僅供瀏覽、列印；編輯請用平板或電腦」，
        //   所以不另設編輯按鈕。要避免電腦／iPad 誤改，就在 OneDrive 另外產生「可以檢視」的分享連結填在這裡
        // PDF_WORKER：Cloudflare Worker「liming-reports-pdf」（原始碼在 worker/reports-pdf/），
        //   按下當下才從 OneDrive 產生最新 PDF，再排成一張 A4 放 4 張（橫式）或 2 張（直式）
        var EDIT_URL   = 'https://1drv.ms/p/c/69de94ef84c9ee8c/IQC4Kv2bDtgfRIvwXjeLcmZNAQqfJk8b4rm7sD2mAm76c5I?e=6GaOmS';
        var VIEW_URL   = EDIT_URL;
        var PDF_WORKER = 'https://liming-reports-pdf.c3012312.workers.dev';

        document.getElementById('viewLink').href = VIEW_URL;
        document.getElementById('pdf4').href = PDF_WORKER + '/print?n=4';
        document.getElementById('pdf2').href = PDF_WORKER + '/print?n=2';
    </script>
</body>
</html>

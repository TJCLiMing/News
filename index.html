<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>黎明教會活動快報</title>
    <link rel="icon" type="image/png" href="logo_10th.png">
    <meta name="theme-color" content="#FF92A9">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="黎明快報">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <script>
        // 防止外殼被自己的 iframe 載入而層層疊套：
        // photos.html / schedule.html 的「← 活動快報」指向 index.html，
        // 在外殼內點下去會落到這裡，直接換成內容頁即可。
        if (window.self !== window.top) {
            var __home = 'home.html';
            try { if (localStorage.getItem('uiStyle') === 'tech') __home = 'index-tech.html'; } catch (e) {}
            location.replace(__home);
        }
        // 科技版使用者：外殼背景改深色，避免載入時閃一下白色
        try {
            if (localStorage.getItem('uiStyle') === 'tech') {
                document.documentElement.classList.add('tech');
            }
        } catch (e) {}
    </script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: #F0F7FF;
        }
        /* 科技版：外殼與載入遮罩改深色，避免深色頁面載入前閃白 */
        html.tech, html.tech body, html.tech #loading {
            background: #04060d;
        }

        #frame {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }

        /* 載入中遮罩 */
        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #F0F7FF;
            transition: opacity 0.3s;
            z-index: 5;
        }
        #loading.hide {
            opacity: 0;
            pointer-events: none;
        }
        #loading img {
            width: 72px;
            height: 72px;
            animation: pulse 1.2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1);    opacity: 1;   }
            50%      { transform: scale(0.88); opacity: 0.55;}
        }

        /* 回首頁浮動鈕：只在離開首頁時出現 */
        #home-btn {
            position: fixed;
            right: 16px;
            bottom: calc(16px + env(safe-area-inset-bottom, 0px));
            width: 52px;
            height: 52px;
            border: 0;
            border-radius: 50%;
            background: rgba(255, 146, 169, 0.94);
            color: #fff;
            font-size: 1.5rem;
            line-height: 1;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.22);
            z-index: 10;
            display: none;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }
        #home-btn.show { display: flex; }
        #home-btn:active { transform: scale(0.9); }
    </style>
</head>
<body>

    <iframe id="frame"
            title="黎明教會活動快報"
            allow="fullscreen; clipboard-write"></iframe>

    <div id="loading"><img src="logo_10th.png" alt="載入中"></div>

    <button id="home-btn" type="button" title="回首頁" aria-label="回首頁">🏠</button>

    <script>
        (function () {
            'use strict';

            var frame = document.getElementById('frame');
            var btn   = document.getElementById('home-btn');
            var load  = document.getElementById('loading');

            // 依使用者上次選的風格決定首頁（科技版直接載入，不經過 home.html 中轉）
            function homePage() {
                try {
                    return localStorage.getItem('uiStyle') === 'tech' ? 'index-tech.html' : 'home.html';
                } catch (e) { return 'home.html'; }
            }

            // 深層連結：/#schedule、/#photos（manifest shortcuts 也用這個）
            var ROUTES = {
                '#schedule': function () { return homePage() + '#schedule'; },
                '#photos':   function () { return 'photos.html'; }
            };
            function routeFor(hash) {
                var r = ROUTES[hash];
                return r ? r() : null;
            }
            // 初始載入：有深層連結走深層連結，否則載入對應風格的首頁
            frame.src = routeFor(location.hash) || homePage();
            // 已經開著外殼時再點捷徑，只會變 hash 不會重載，要另外接
            window.addEventListener('hashchange', function () {
                var r = routeFor(location.hash);
                if (r) frame.src = r;
            });

            // 首頁清單：能讀到路徑（同網域）且落在這些頁面才算「在首頁」
            // 注意不能把根目錄「/」算進來 —— 根目錄現在是外殼本身
            function isHomePath(path) {
                return /(^|\/)(home\.html|index-tech\.html)$/.test(path);
            }

            // 跨網域時讀取 location 會丟出例外 —— 這正好代表「已經離開首頁」
            function refreshHomeBtn() {
                var atHome = false;
                try {
                    atHome = isHomePath(frame.contentWindow.location.pathname);
                } catch (e) {
                    atHome = false;
                }
                btn.classList.toggle('show', !atHome);
            }

            frame.addEventListener('load', function () {
                load.classList.add('hide');
                refreshHomeBtn();
            });

            btn.addEventListener('click', function () {
                frame.src = homePage();
            });

            // 保險：萬一 load 事件沒觸發，3 秒後也要收掉遮罩
            setTimeout(function () { load.classList.add('hide'); }, 3000);

            // Service Worker：離線快取 + Android 安裝提示
            // 不做 controllerchange 自動 reload：HTML 本來就網路優先（永遠最新），
            // SW 版本只影響圖片/JS 快取，讓新版下次訪問自然接手即可，
            // 當場 reload 反而造成「載入後閃一下重刷」。
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', function () {
                    navigator.serviceWorker.register('sw.js').catch(function () { /* 失敗就當作沒有 */ });
                });
            }
        })();
    </script>

</body>
</html>
